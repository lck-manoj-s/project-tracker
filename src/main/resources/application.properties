# Server
server.port=8081

# Active profile — defaults to 'local' so running the app directly (IDE / mvn
# spring-boot:run) always hits the local dev database and can never touch live
# data by accident. The Tomcat-deployed "live" instance (see deploy.sh) forces
# spring.profiles.active=live via a JVM system property, which overrides this.
# Per-profile datasource URLs live in application-local.properties /
# application-live.properties.
spring.profiles.active=local

# MySQL DataSource (connection settings shared by both profiles — only the
# database name differs, set per-profile)
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Error handling
server.error.whitelabel.enabled=false

# Logging
logging.level.com.manoj=DEBUG
